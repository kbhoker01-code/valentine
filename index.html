<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valentine?</title>
  <style>
    :root{
      --pink:#ff2e6f;
      --pink2:#ff5b8c;
      --bg:#fff1f6;
      --card:#ffffffcc;
      --text:#222;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(1100px 700px at 15% 15%, #ffd1df, transparent 60%),
        radial-gradient(900px 700px at 85% 85%, #ffc1d6, transparent 55%),
        linear-gradient(135deg, var(--bg), #fff);
      overflow:hidden;
      padding:24px;
      color:var(--text);
    }
    .card{
      width:min(560px, 92vw);
      background:var(--card);
      backdrop-filter: blur(10px);
      border:1px solid rgba(255,255,255,.65);
      border-radius:22px;
      box-shadow: 0 20px 60px rgba(0,0,0,.12);
      padding:26px 22px;
      text-align:center;
      position:relative;
    }
    .chip{
      display:inline-flex;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      background: rgba(255,46,111,.10);
      color: var(--pink);
      font-weight:700;
      font-size:14px;
    }
    h1{
      margin:12px 0 6px;
      font-size: clamp(26px, 4.8vw, 42px);
      letter-spacing:-0.02em;
    }
    p{ margin:0 0 18px; opacity:.85; }
    .meterWrap{
      margin:14px auto 18px;
      width:min(420px, 92%);
      text-align:left;
    }
    .meterLabel{
      display:flex;
      justify-content:space-between;
      font-weight:700;
      font-size:14px;
      opacity:.9;
      margin-bottom:8px;
    }
    .meter{
      height:14px;
      background:#eee;
      border-radius:999px;
      overflow:hidden;
      box-shadow: inset 0 2px 6px rgba(0,0,0,.08);
    }
    .fill{
      height:100%;
      width:0%;
      background: linear-gradient(90deg, var(--pink), var(--pink2));
      border-radius:999px;
      transition: width .25s ease;
    }
    .btnRow{
      display:flex;
      justify-content:center;
      gap:12px;
      margin-top:10px;
      flex-wrap:wrap;
    }
    button{
      border:none;
      padding:12px 18px;
      font-size:16px;
      border-radius:14px;
      cursor:pointer;
      font-weight:800;
      transition: transform .12s ease, box-shadow .12s ease;
      -webkit-tap-highlight-color: transparent;
      user-select:none;
    }
    #yes{
      color:white;
      background: linear-gradient(135deg, var(--pink), var(--pink2));
      box-shadow: 0 12px 24px rgba(255,46,111,.28);
    }
    #yes:hover{transform: translateY(-1px) scale(1.02)}
    #no{
      background:#f1f1f4;
      color:#444;
      box-shadow: 0 10px 20px rgba(0,0,0,.08);
      transform-origin:center;
    }
    .hint{font-size:13px; opacity:.72; margin-top:12px}
    .toast{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      bottom:-18px;
      background:#111;
      color:#fff;
      padding:10px 14px;
      border-radius:999px;
      font-size:13px;
      opacity:0;
      pointer-events:none;
      transition: opacity .2s ease, transform .2s ease;
      box-shadow:0 14px 26px rgba(0,0,0,.18);
    }
    .toast.show{opacity:1; transform: translateX(-50%) translateY(-8px);}
    .success{
      display:none;
      text-align:center;
      animation: pop .35s ease both;
    }
    @keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
    .big{font-size:56px; margin:10px 0 0}
    .confetti{
      position:fixed; inset:0; pointer-events:none; overflow:hidden;
    }
    .dot{
      position:absolute;
      top:-10px;
      width:10px; height:10px;
      border-radius:2px;
      opacity:.9;
      animation: fall linear forwards;
    }
    @keyframes fall{
      to{ transform: translateY(110vh) rotate(540deg); opacity:0; }
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <div class="chip">💌 Valentine Request</div>
    <h1>Will you be my Valentine? 💖</h1>
    <p>Try saying “No”… but the love meter might disagree 😭</p>

    <div class="meterWrap">
      <div class="meterLabel">
        <span>Love Meter</span>
        <span id="percent">0%</span>
      </div>
      <div class="meter"><div class="fill" id="fill"></div></div>
    </div>

    <div class="btnRow">
      <button id="yes">Yes 🥰</button>
      <button id="no">No 🙄</button>
    </div>

    <div class="hint">Tip: On phone, tap “No” 😌</div>
    <div class="toast" id="toast">Nice try 😭</div>
  </div>

  <div class="card success" id="success">
    <div class="chip">✅ Accepted</div>
    <div class="big">💘</div>
    <h1>Yay! It’s official 🥹</h1>
    <p>Happy Valentine’s! I knew you’d say yes 😄🌹</p>
    <p class="hint">Screenshot this and send it to me 😌</p>
  </div>

  <div class="confetti" id="confetti"></div>

<script>
  const no = document.getElementById("no");
  const yes = document.getElementById("yes");
  const fill = document.getElementById("fill");
  const percent = document.getElementById("percent");
  const toast = document.getElementById("toast");
  const card = document.getElementById("card");
  const success = document.getElementById("success");
  const confetti = document.getElementById("confetti");

  let meter = 0;
  let noScale = 1;

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(()=>toast.classList.remove("show"), 650);
  }

  function bumpMeter(){
    meter = Math.min(100, meter + 18);
    fill.style.width = meter + "%";
    percent.textContent = meter + "%";
  }

  function weakenNo(){
    noScale = Math.max(0.55, noScale - 0.12);
    no.style.transform = `scale(${noScale})`;
  }

  function handleNo(){
    bumpMeter();
    weakenNo();

    const messages = [
      "Nice try 😭",
      "The meter says… nope 💗",
      "Stop resisting 😌",
      "It’s destiny 💘",
      "Just press Yes already 🥹"
    ];
    showToast(messages[Math.min(messages.length-1, Math.floor(meter/25))]);

    if (meter >= 90){
      showToast("Okay okay… the only option left is YES 😌");
      no.textContent = "…fine 😭";
    }
  }

  no.addEventListener("mouseenter", handleNo);
  no.addEventListener("click", handleNo);
  no.addEventListener("touchstart", (e)=>{ e.preventDefault(); handleNo(); }, {passive:false});

  function launchConfetti(){
    for(let i=0;i<80;i++){
      const d = document.createElement("div");
      d.className = "dot";
      d.style.left = (Math.random()*100) + "vw";
      d.style.background = `hsl(${Math.random()*360}, 90%, 65%)`;
      const dur = 2.2 + Math.random()*2.2;
      d.style.animationDuration = dur + "s";
      d.style.transform = `translateY(0) rotate(${Math.random()*360}deg)`;
      confetti.appendChild(d);
      setTimeout(()=>d.remove(), dur*1000);
    }
  }

  yes.addEventListener("click", ()=>{
    card.style.display = "none";
    success.style.display = "block";
    launchConfetti();
  });
</script>

</body>
</html>
