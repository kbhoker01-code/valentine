<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valentine?</title>
  <style>
    :root{
      --bg1:#fff1f6;
      --bg2:#ffe0ea;
      --card:#ffffffcc;
      --pink:#ff2e6f;
      --pink2:#ff5b8c;
      --text:#2a2a2a;
    }
    *{box-sizing:border-box;}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background: radial-gradient(1200px 800px at 20% 10%, var(--bg2), transparent 60%),
                  radial-gradient(1200px 800px at 80% 90%, #ffd1df, transparent 60%),
                  linear-gradient(135deg, var(--bg1), #fff);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow:hidden;
      color:var(--text);
      padding:24px;
    }

    /* Floating hearts background */
    .hearts{
      position:fixed; inset:0;
      pointer-events:none;
      overflow:hidden;
      z-index:0;
    }
    .heart{
      position:absolute;
      bottom:-40px;
      font-size:18px;
      opacity:.75;
      animation: floatUp linear infinite;
      filter: drop-shadow(0 6px 10px rgba(255,46,111,.2));
    }
    @keyframes floatUp{
      from { transform: translateY(0) translateX(0) rotate(0deg); opacity:.0; }
      10% { opacity:.75; }
      to   { transform: translateY(-110vh) translateX(var(--drift)) rotate(18deg); opacity:0; }
    }

    /* Card */
    .card{
      position:relative;
      z-index:1;
      width:min(520px, 92vw);
      padding:26px 22px;
      border-radius:22px;
      background: var(--card);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.65);
      box-shadow: 0 20px 60px rgba(0,0,0,.12);
      text-align:center;
    }
    .badge{
      display:inline-flex;
      gap:8px;
      align-items:center;
      padding:8px 12px;
      border-radius:999px;
      background: rgba(255,46,111,.10);
      color: var(--pink);
      font-weight:600;
      font-size:14px;
      margin-bottom:10px;
    }
    h1{
      margin:10px 0 8px;
      font-size: clamp(26px, 4.8vw, 40px);
      letter-spacing:-0.02em;
    }
    p{
      margin:0 0 18px;
      opacity:.85;
      font-size: 15.5px;
      line-height:1.45;
    }

    /* Buttons area */
    .btnRow{
      position:relative;
      height:64px;
      margin-top:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;
    }
    button{
      border:none;
      border-radius:14px;
      padding:12px 18px;
      font-size:16px;
      cursor:pointer;
      transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    #yesBtn{
      background: linear-gradient(135deg, var(--pink), var(--pink2));
      color:white;
      font-weight:700;
      box-shadow: 0 12px 24px rgba(255,46,111,.28);
    }
    #yesBtn:hover{ transform: translateY(-1px) scale(1.02); }
    #yesBtn:active{ transform: translateY(0) scale(.99); }

    #noBtn{
      background: #f2f2f4;
      color:#555;
      font-weight:700;
      position:absolute;
      left: calc(50% + 90px);
      top: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 10px 22px rgba(0,0,0,.08);
    }

    /* Success screen */
    .success{
      display:none;
      animation: pop .35s ease both;
    }
    @keyframes pop{
      from { transform: scale(.94); opacity:0; }
      to   { transform: scale(1); opacity:1; }
    }
    .bigHeart{
      font-size:54px;
      margin:10px 0 6px;
      animation: pulse 1.1s ease-in-out infinite;
    }
    @keyframes pulse{
      0%,100%{ transform: scale(1); }
      50%{ transform: scale(1.08); }
    }

    .tiny{
      font-size:13px;
      opacity:.75;
      margin-top:10px;
    }
  </style>
</head>
<body>
  <div class="hearts" id="hearts"></div>

  <div class="card" id="card">
    <div class="badge">💌 Valentine request</div>
    <h1>Will you be my Valentine?</h1>
    <p>Be honest… I already know the answer 😌💖</p>

    <div class="btnRow" id="arena">
      <button id="yesBtn">Yes 🥰</button>
      <button id="noBtn">No 🙄</button>
    </div>

    <div class="tiny">Tip: try pressing “No” 😭</div>
  </div>

  <div class="card success" id="success">
    <div class="badge">✅ Accepted</div>
    <div class="bigHeart">💖</div>
    <h1>Yay! It’s a date 🥹</h1>
    <p>Happy Valentine’s! I knew you’d say yes 😄🌹</p>
    <p class="tiny">Now send me a screenshot 😌</p>
  </div>

  <script>
    // Floating hearts background
    const hearts = document.getElementById("hearts");
    const heartChars = ["💗","💖","💘","💝","💕","❤️"];
    function spawnHeart(){
      const h = document.createElement("div");
      h.className = "heart";
      h.textContent = heartChars[Math.floor(Math.random()*heartChars.length)];
      const left = Math.random()*100;
      const size = 14 + Math.random()*18;
      const dur = 6 + Math.random()*7;
      const drift = (Math.random()*120 - 60) + "px";
      h.style.left = left + "vw";
      h.style.fontSize = size + "px";
      h.style.animationDuration = dur + "s";
      h.style.setProperty("--drift", drift);
      hearts.appendChild(h);
      setTimeout(()=>h.remove(), dur*1000);
    }
    setInterval(spawnHeart, 320);
    for(let i=0;i<8;i++) setTimeout(spawnHeart, i*120);

    // Buttons logic
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const arena = document.getElementById("arena");
    const card = document.getElementById("card");
    const success = document.getElementById("success");

    // Move "No" button within the arena (so it doesn't fly off-screen)
    function moveNo(){
      const arenaRect = arena.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      const padding = 6;
      const maxX = arenaRect.width - btnRect.width - padding;
      const maxY = arenaRect.height - btnRect.height - padding;

      const x = padding + Math.random() * Math.max(0, maxX);
      const y = padding + Math.random() * Math.max(0, maxY);

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
      noBtn.style.transform = "translate(0, 0)";
    }

    // Desktop hover + Mobile tap
    noBtn.addEventListener("mouseenter", moveNo);
    noBtn.addEventListener("touchstart", (e)=>{ e.preventDefault(); moveNo(); }, {passive:false});

    yesBtn.addEventListener("click", ()=>{
      card.style.display = "none";
      success.style.display = "block";
      // quick confetti-ish burst of hearts
      for(let i=0;i<18;i++) setTimeout(spawnHeart, i*40);
    });

    // Start with a slightly moved No button (nice look)
    setTimeout(moveNo, 250);
  </script>
</body>
</html>
